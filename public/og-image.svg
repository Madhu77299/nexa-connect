<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#08111f" />
      <stop offset="60%" stop-color="#101c2f" />
      <stop offset="100%" stop-color="#08111f" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3167ff" />
      <stop offset="100%" stop-color="#20c9b5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Background Decorative Glowing Orbs -->
  <circle cx="200" cy="150" r="220" fill="#3167ff" opacity="0.18" filter="url(#glow)" />
  <circle cx="1000" cy="480" r="260" fill="#20c9b5" opacity="0.14" filter="url(#glow)" />
  <circle cx="600" cy="300" r="180" fill="#ff715b" opacity="0.08" filter="url(#glow)" />

  <!-- Grid overlay -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200" />
    <path d="M200 0 V630 M400 0 V630 M600 0 V630 M800 0 V630 M1000 0 V630" />
  </g>

  <!-- Outer Glass Frame -->
  <rect x="50" y="50" width="1100" height="530" rx="24" stroke="rgba(255,255,255,0.12)" stroke-width="2" fill="rgba(255,255,255,0.02)" />

  <!-- Corporate Pill Badge -->
  <g transform="translate(100, 110)">
    <rect width="280" height="40" rx="20" fill="rgba(49, 103, 255, 0.15)" stroke="rgba(49, 103, 255, 0.4)" stroke-width="1" />
    <circle cx="20" cy="20" r="5" fill="#20c9b5" />
    <text x="36" y="25" fill="#e9eef7" font-family="'Manrope', -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="2">PMK NEXA SOLUTIONS</text>
  </g>

  <!-- Headline -->
  <text x="100" y="240" fill="#ffffff" font-family="'Manrope', -apple-system, sans-serif" font-size="56" font-weight="900" letter-spacing="-1">
    Connecting Business.
  </text>
  <text x="100" y="310" fill="url(#brandGrad)" font-family="'Manrope', -apple-system, sans-serif" font-size="56" font-weight="900" letter-spacing="-1">
    Creating Growth.
  </text>

  <!-- Subtitle / Tagline -->
  <text x="100" y="380" fill="#94a3b8" font-family="'Manrope', -apple-system, sans-serif" font-size="22" font-weight="500">
    Enterprise Ecosystem for Business Development, Vendor Networks, Events &amp; Tech.
  </text>

  <!-- Capabilities Pill Badges -->
  <g transform="translate(100, 440)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="190" height="42" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
    <text x="20" y="26" fill="#e2e8f0" font-family="'Manrope', sans-serif" font-size="14" font-weight="700">Business Growth</text>

    <!-- Badge 2 -->
    <rect x="205" y="0" width="180" height="42" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
    <text x="225" y="26" fill="#e2e8f0" font-family="'Manrope', sans-serif" font-size="14" font-weight="700">Vendor Networks</text>

    <!-- Badge 3 -->
    <rect x="400" y="0" width="170" height="42" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
    <text x="420" y="26" fill="#e2e8f0" font-family="'Manrope', sans-serif" font-size="14" font-weight="700">Event Ops</text>

    <!-- Badge 4 -->
    <rect x="585" y="0" width="180" height="42" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
    <text x="605" y="26" fill="#e2e8f0" font-family="'Manrope', sans-serif" font-size="14" font-weight="700">Tech &amp; Digital</text>
  </g>

  <!-- Website URL Footer -->
  <text x="100" y="535" fill="#38bdf8" font-family="'Manrope', sans-serif" font-size="16" font-weight="700" letter-spacing="1">
    https://nexa-connect-gold.vercel.app
  </text>
</svg>
